# Fleetza Suppliers Backend Configuration
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${PORT:8080}
spring.application.name=fleetza-suppliers

# Active Profile: Defaulting to mysql for production persistence
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

# Database Resilience (Keep false in production so missing MySQL fails fast instead of volatile RAM fallback)
app.db.allow-h2-fallback=${DB_ALLOW_H2_FALLBACK:false}

# Initial Admin / Demo Seeding (Never seed demo suppliers or weak password aliases in production)
app.admin.initial-password=${ADMIN_INITIAL_PASSWORD:Admin@12345}
app.seed-demo-data=${SEED_DEMO_DATA:false}
app.auth.allow-demo-aliases=${ALLOW_DEMO_AUTH_ALIASES:false}

# JWT Security (Provide a 64+ char secret in /etc/fleetza/supplier.env via: openssl rand -hex 32)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:2592000000}

# CORS Allowed Origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://supplier.fleetza.in,https://www.supplier.fleetza.in}

# Web Push (VAPID) Zero-Cost Browser Push Configuration (loaded from /etc/fleetza/supplier.env on VPS)
app.vapid.public-key=${VAPID_PUBLIC_KEY:}
app.vapid.private-key=${VAPID_PRIVATE_KEY:}
app.vapid.subject=${VAPID_SUBJECT:mailto:admin@fleetza.in}

# Logging
logging.level.com.fleetza.suppliers=INFO
logging.level.org.springframework.security=WARN

# Jackson Serialization / Deserialization
spring.jackson.deserialization.fail-on-unknown-properties=false
