# Fleetza Suppliers Backend Configuration
server.port=${PORT:8080}
spring.application.name=fleetza-suppliers

# Active Profile: Defaulting to mysql for production standard persistence
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

# JWT Security
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:2592000000}

# CORS Allowed Origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://*.netlify.app,https://supplier.edutomorrow.in,http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174}

# Logging
logging.level.com.fleetza.suppliers=INFO
logging.level.org.springframework.security=WARN

# Jackson Serialization / Deserialization
spring.jackson.deserialization.fail-on-unknown-properties=false
