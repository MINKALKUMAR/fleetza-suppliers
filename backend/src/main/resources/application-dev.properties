# Dev Profile: In-memory H2 with PostgreSQL compatibility mode for instant zero-dependency testing
spring.datasource.url=jdbc:h2:mem:fleetza_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Dev/Test-only defaults (never used in production mysql profile)
app.jwt.secret=${JWT_SECRET:DevOnlyJwtSecretKeyDoNotUseInProductionMustBeAtLeast64BytesLong1234567890}
app.seed-demo-data=${SEED_DEMO_DATA:true}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174}
