# MySQL Configuration Profile: Connect to MySQL database
# Safe configuration: ddl-auto=update preserves all existing tables and data without any risk of data loss.

# DataSource Configuration: Works both locally and automatically with Railway MySQL
spring.datasource.url=${DB_URL:${MYSQL_URL:jdbc:mysql://${DB_HOST:${MYSQLHOST:localhost}}:${DB_PORT:${MYSQLPORT:3306}}/${DB_NAME:${MYSQLDATABASE:fleetza_suppliers}}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&createDatabaseIfNotExist=true&characterEncoding=UTF-8}}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:@bhishekSQL8755}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate DDL update - schema auto-managed cleanly
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Performance & Batching optimizations for 100+ Suppliers
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# High-Performance HikariCP Connection Pool Configured for 100+ Concurrent Suppliers
spring.datasource.hikari.pool-name=FleetzaHikariPool
spring.datasource.hikari.maximum-pool-size=35
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000
