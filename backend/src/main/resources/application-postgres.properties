# PostgreSQL Profile: Connect to local or dockerized PostgreSQL instance
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fleetza_suppliers}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgrespassword}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
