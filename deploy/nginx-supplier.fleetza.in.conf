# /etc/nginx/sites-available/supplier.fleetza.in
# Install:
#   sudo cp deploy/nginx-supplier.fleetza.in.conf /etc/nginx/sites-available/supplier.fleetza.in
#   sudo ln -sf /etc/nginx/sites-available/supplier.fleetza.in /etc/nginx/sites-enabled/supplier.fleetza.in
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d supplier.fleetza.in

server {
    listen 80;
    listen [::]:80;
    server_name supplier.fleetza.in;

    root "/var/www/Fleetza Private Limited/Supplier/frontend/dist";
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression for fast mobile loading
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/manifest+json image/svg+xml;

    # Reverse proxy all API requests to local Spring Boot backend (port 8081 avoids colliding with fuel.fleetza.in on 8080)
    location /api/ {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 15s;
    }

    # Critical for PWA & Web Push: Never cache sw.js, manifest.webmanifest, or index.html
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Long cache for hashed Vite build assets & PWA icons
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA React Router fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

